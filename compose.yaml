services:
  db:
    image: postgres:16-alpine
    container_name: reelsai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelsai
      POSTGRES_USER: reelsai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelsai}
    volumes:
      - reelsai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelsai -d reelsai"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    container_name: reelsai-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://reelsai:${POSTGRES_PASSWORD:-reelsai}@db:5432/reelsai
      EDITOR_IP: ${EDITOR_IP:-185.113.39.206}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}

  web:
    build:
      context: .
    container_name: reelsai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  reelsai-postgres:
    name: reelsai-postgres
