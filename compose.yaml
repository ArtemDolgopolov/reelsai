services:
  db:
    image: postgres:16-alpine
    container_name: reelsai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelsai
      POSTGRES_USER: reelsai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reelsai}
    volumes:
      - reelsai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelsai -d reelsai"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    container_name: reelsai-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://reelsai:${POSTGRES_PASSWORD:-reelsai}@db:5432/reelsai
      EDITOR_IP: ${EDITOR_IP:-185.113.39.206}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      GROQ_WHISPER_MODEL: ${GROQ_WHISPER_MODEL:-whisper-large-v3}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_DEV_EXPOSE_OTP: ${AUTH_DEV_EXPOSE_OTP:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-AI Рилс Менеджер <onboarding@resend.dev>}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://18.192.179.203.sslip.io}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    volumes:
      - reelsai-auth-secrets:/var/lib/reelsai

  web:
    build:
      context: .
    container_name: reelsai-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - reelsai-caddy-data:/data
      - reelsai-caddy-config:/config

volumes:
  reelsai-postgres:
    name: reelsai-postgres
  reelsai-auth-secrets:
    name: reelsai-auth-secrets
  reelsai-caddy-data:
    name: reelsai-caddy-data
  reelsai-caddy-config:
    name: reelsai-caddy-config
