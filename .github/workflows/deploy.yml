name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on:
      - self-hosted
      - Linux
      - X64
      - reelsai
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Sync deployment directory
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: |
          sudo mkdir -p /opt/reelsai
          sudo rsync -a --delete --exclude .git --exclude .env ./ /opt/reelsai/
          if [ ! -f /opt/reelsai/.env ]; then
            cp /opt/reelsai/.env.example /opt/reelsai/.env
          else
            # Merge new keys from example without overwriting existing values
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) continue ;;
              esac
              key="${line%%=*}"
              if [ -n "$key" ] && ! grep -q "^${key}=" /opt/reelsai/.env; then
                echo "$line" >> /opt/reelsai/.env
              fi
            done < /opt/reelsai/.env.example
          fi
          if ! grep -q '^PUBLIC_APP_URL=' /opt/reelsai/.env; then
            echo 'PUBLIC_APP_URL=https://18.192.179.203.sslip.io' >> /opt/reelsai/.env
          else
            # Keep OAuth on free HTTPS host (no purchased domain)
            sed -i 's|^PUBLIC_APP_URL=.*|PUBLIC_APP_URL=https://18.192.179.203.sslip.io|' /opt/reelsai/.env
          fi
          upsert_env() {
            key="$1"
            val="$2"
            [ -z "$val" ] && return 0
            if grep -q "^${key}=" /opt/reelsai/.env; then
              sed -i "s|^${key}=.*|${key}=${val}|" /opt/reelsai/.env
            else
              echo "${key}=${val}" >> /opt/reelsai/.env
            fi
          }
          # Inject secrets from GitHub without committing them
          upsert_env RESEND_API_KEY "${RESEND_API_KEY:-}"
          upsert_env YANDEX_CLIENT_ID "${YANDEX_CLIENT_ID:-}"
          upsert_env YANDEX_CLIENT_SECRET "${YANDEX_CLIENT_SECRET:-}"
          upsert_env AUTH_COOKIE_SECURE true
          if [ -n "${RESEND_API_KEY:-}" ]; then
            upsert_env AUTH_DEV_EXPOSE_OTP false
          fi
          sudo chown -R "$USER":"$USER" /opt/reelsai

      - name: Ensure swap for small instance builds
        run: |
          if [ "$(swapon --show | wc -l)" -eq 0 ]; then
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -m

      - name: Build and start application
        working-directory: /opt/reelsai
        run: |
          docker compose build --pull --no-cache api web
          docker compose up --detach --remove-orphans

      - name: Verify deployment
        run: |
          for attempt in {1..48}; do
            if curl --fail --silent --show-error http://127.0.0.1/api/health | grep --quiet '"status":"ok"'; then
              if curl --fail --silent --show-error http://127.0.0.1/ | grep --quiet -E "AI Рилс Продюсер|Reels Finder|reelsai"; then
                exit 0
              fi
              # SPA shell may only reference hashed assets — accept healthy API + index.html
              if curl --fail --silent --show-error http://127.0.0.1/ | grep --quiet 'id="app"'; then
                exit 0
              fi
            fi
            sleep 5
          done
          docker compose --project-directory /opt/reelsai logs
          exit 1

      - name: Remove unused Docker images
        if: success()
        run: docker image prune --force
